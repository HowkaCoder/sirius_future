services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - data:/app/database
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  data:
  grafana_data:
