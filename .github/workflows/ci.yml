name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet, build, test
        run: |
          run() {
            if ! "$@" > out.txt 2>&1; then
              cat out.txt
              echo "::error title=$*::$(tail -n 80 out.txt | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
              exit 1
            fi
            cat out.txt
          }
          run go vet ./...
          run go build ./...
          run go test -race ./...
